<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagar — NEXORA AI</title><style>body{margin:0;background:#0b1020;color:#f5f7ff;font-family:system-ui,sans-serif}.wrap{max-width:520px;margin:auto;padding:22px}.card{background:#141b2e;border:1px solid #2a3550;border-radius:20px;padding:20px}h1{margin-top:0}label{display:block;margin-top:12px;color:#aeb8cc}input{width:100%;box-sizing:border-box;padding:13px;border-radius:12px;border:1px solid #394663;background:#0e1424;color:white;font-size:16px}.btn{width:100%;margin-top:16px;padding:15px;border:0;border-radius:12px;background:#b7ff21;color:#101500;font-weight:800;font-size:16px}.small{font-size:13px;color:#9da8c0}.ok{margin-top:16px;padding:14px;border-radius:12px;background:#0f1830}.link{display:block;margin-top:10px;padding:13px;text-align:center;border-radius:10px;background:#fff;color:#111;text-decoration:none;font-weight:800}</style></head><body><main class="wrap"><div class="card"><h1>💳 Pagamento NEXORA AI</h1><p class="small">O cliente poderá pagar por Pix ou cartão de crédito em uma página segura do Asaas.</p><label>Produto ou serviço</label><input id="name" value="Serviço NEXORA AI"><label>Valor (R$)</label><input id="value" type="number" min="1" step="0.01" placeholder="500,00"><label>Nome do cliente (opcional)</label><input id="customer" placeholder="Nome completo"><button class="btn" id="pay">Gerar pagamento Pix + cartão</button><div id="out"></div></div></main><script>const $=id=>document.getElementById(id);$('pay').onclick=async()=>{const value=Number($('value').value);if(!value||value<=0){alert('Informe um valor válido.');return}const b=$('pay');b.disabled=true;b.textContent='Gerando pagamento…';try{const r=await fetch('/api/payment/checkout',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:$('name').value||'Serviço NEXORA AI',value,customer:$('customer').value?{name:$('customer').value}:undefined})});const d=await r.json();if(!d.ok)throw Error(d.error||'Não foi possível gerar');$('out').innerHTML='<div class="ok"><strong>Pagamento criado.</strong><p class="small">Abra o link abaixo para escolher Pix ou cartão de crédito.</p><a class="link" href="'+d.link+'" target="_blank" rel="noopener">Abrir pagamento seguro</a></div>'}catch(e){alert(e.message||'Erro')}finally{b.disabled=false;b.textContent='Gerar pagamento Pix + cartão'}};</script></body></html>

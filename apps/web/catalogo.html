<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA AI — Cadastro Inteligente</title><style>body{margin:0;background:#0b1020;color:#f5f7ff;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#141b2e;border:1px solid #27324d;border-radius:18px;padding:18px;margin:14px 0}.brand{font-size:24px;font-weight:800}.muted{color:#aab4ca}textarea{box-sizing:border-box;width:100%;background:#0f1526;color:#fff;border:1px solid #35415f;border-radius:12px;padding:13px;font-size:16px;min-height:150px}.btn{border:0;border-radius:12px;padding:13px 16px;background:#b7ff21;color:#101500;font-weight:800;font-size:15px;margin-top:10px}.btn.secondary{background:#25304a;color:#fff}.grid{display:grid;gap:10px}.item{background:#0f1526;border:1px solid #27324d;border-radius:14px;padding:13px}.row{display:flex;justify-content:space-between;gap:10px}.price{font-weight:800}.tag{font-size:12px;color:#b7ff21}.note{font-size:13px;color:#9da8c0}.back{color:#b7ff21;text-decoration:none}</style></head><body><main class="wrap"><a class="back" href="/?page=home">← Voltar ao Controle pelo celular</a><div class="card"><div class="brand">✨ NEXORA AI — Cadastro Inteligente</div><p class="muted">Cole uma lista de produtos. O NEXORA identifica nome e preço, cria a categoria e gera uma descrição automaticamente.</p><textarea id="input" placeholder="Exemplo:\nPiso Vinílico R$ 12,90\nArgamassa R$ 18,50\nAlicate Universal R$ 14,90\nTinta Acrílica R$ 22,90"></textarea><button class="btn" id="generate">✨ Cadastrar com IA</button><button class="btn secondary" id="clear">Limpar</button></div><div class="card"><div class="row"><strong>Produtos cadastrados</strong><span id="count" class="tag">0</span></div><div id="list" class="grid" style="margin-top:12px"><p class="note">Nenhum produto cadastrado ainda.</p></div></div></main><script>const input=document.querySelector('#input'),list=document.querySelector('#list'),count=document.querySelector('#count');const money=v=>v==null?'Preço não informado':new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}async function load(){try{const r=await fetch('/api/smart-catalog');const d=await r.json();render(d.products||[])}catch(e){}}function render(items){count.textContent=items.length;list.innerHTML=items.length?items.map(p=>'<div class="item"><div class="row"><strong>'+esc(p.name)+'</strong><span class="price">'+money(p.price)+'</span></div><div class="tag">'+esc(p.category||'Geral')+'</div><p class="note">'+esc(p.description||'')+'</p></div>').join(''):'<p class="note">Nenhum produto cadastrado ainda.</p>'}document.querySelector('#generate').onclick=async()=>{const text=input.value.trim();if(!text){alert('Cole pelo menos um produto.');return}const b=document.querySelector('#generate');b.disabled=true;b.textContent='Processando…';try{const r=await fetch('/api/smart-catalog',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({input:text})});const d=await r.json();if(!d.ok)throw Error(d.error||'Erro');input.value='';render(d.products||[])}catch(e){alert(e.message||'Não foi possível cadastrar.')}finally{b.disabled=false;b.textContent='✨ Cadastrar com IA'}};document.querySelector('#clear').onclick=()=>input.value='';load();</script></body></html>

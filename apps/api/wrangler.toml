name = "nexora-ai"
main = "src/worker.js"
compatibility_date = "2026-09-05"

[assets]
directory = "../web"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "nexora-ai"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "../../database/migrations"

[vars]
APP_MODE = "autonomo"

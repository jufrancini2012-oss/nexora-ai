name: Deploy NEXORA AI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Testar API antes do deploy
        working-directory: apps/api
        run: npm test

      - name: Sincronizar ID atual do D1
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          DB_INFO="$(npx --yes wrangler@4 d1 info nexora-ai --json)"
          DB_ID="$(printf '%s' "$DB_INFO" | grep -Eo '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' | head -n 1)"
          if [ -z "$DB_ID" ]; then
            echo "Não foi possível localizar o ID atual do D1 nexora-ai."
            exit 1
          fi
          echo "D1 nexora-ai localizado; sincronizando o identificador no Wrangler."
          sed -i -E "s/^database_id = \"[^\"]+\"/database_id = \"$DB_ID\"/" wrangler.toml

      - name: Aplicar migrações D1
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 d1 migrations apply DB --remote

      - name: Deploy na Cloudflare
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy

name: Deploy NEXORA AI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Testar API antes do deploy
        working-directory: apps/api
        run: npm test

      - name: Sincronizar ID atual do D1
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 98cf18038e390ed6ff7684d12f4f6e2
        run: |
          DB_INFO="$(curl -fsSL \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?name=nexora-ai&per_page=10")"
          DB_ID="$(printf '%s' "$DB_INFO" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => input += chunk);
            process.stdin.on("end", () => {
              const data = JSON.parse(input);
              const db = (data.result || []).find((item) => item.name === "nexora-ai");
              if (!db?.uuid) process.exit(1);
              process.stdout.write(db.uuid);
            });
          ')"
          if [ -z "$DB_ID" ]; then
            echo "Não foi possível localizar o ID atual do D1 nexora-ai pela API do Cloudflare."
            exit 1
          fi
          echo "D1 nexora-ai localizado; sincronizando o identificador no Wrangler."
          sed -i -E "s/^database_id = \"[^\"]+\"/database_id = \"$DB_ID\"/" wrangler.toml

      - name: Aplicar migrações D1
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 d1 migrations apply DB --remote

      - name: Deploy na Cloudflare
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy

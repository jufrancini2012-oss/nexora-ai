name: Deploy DeyvidTEC

on:
  push:
    paths:
      - 'apps/web/deyvidtec/**'
      - '.github/workflows/deploy-deyvidtec.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Publicar DeyvidTEC na Cloudflare
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy
      - name: Verificar link público
        run: |
          set -e
          sleep 5
          BODY=$(curl -fsSL --retry 5 --retry-delay 3 https://nexora-ai.ju-francini2012.workers.dev/deyvidtec/)
          echo "$BODY" | grep -q "NEX/DEYVIDTEC"
          echo "DEYVIDTEC_PUBLIC_OK"
